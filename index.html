<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Habit Tracker</title>

            <!--Typography Inter-->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

            <!--Icons-->
            <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

            <link rel="stylesheet" href="style.css">
            <script src="script.js" defer></script>
            
        </head>

<body>
    <main class="container">
        <h1>Hello !</h1>
        
        <div class="box">
            
            <div class="today-habits">
            <h2>Today's Habits</h2>
            
            <!-- New Habit Form Hidden -->
            <div class="new-habit" id="new-habit">
            <input class="text-input" type="text" placeholder="Add a new habit"><button class="btn btn-primary" id="add-habit-button">
                <i class="fi fi-rr-plus"></i>
                </button></input>
            </div>
            
            <!-- New Habit Button -->
            <button class="btn btn-primary" id="add-habit">
                <i class="fi fi-rr-plus is-active" id="plus-add-habit"></i>
                <i class="fi fi-rr-minus-small" id="minus-add-habit"></i>New Habit
            </button>
            </div>
            
            <!-- Habits List -->
            <!-- Habits will be added here dynamically -->
            <div class="today-habits" id="habits-list"></div>

        </div>
        <!-- Progress Bar -->
        <div class="box" id="completion">
            <p>0% completed ★</p>
            <progress class="progress" id="file" max="" value=""></progress>
        </div>

        <!-- Modification Modal -->
        <button command="show-modal" commandfor="modify-modal">Ouvrir la boîte de dialogue</button>
        <dialog id="modify-modal">
            <h2>Modify content</h2>
            <input class="text-input" type="text" placeholder="Modify habit name"><button class="btn btn-primary" id="modify-habit-name-btn">Validate</button></input>
        <button class="btn btn-primary" command="close" commandfor="modify-modal">Close</button></dialog>
    </main>
</body>
<footer class="footer">
    <p>Developed by <a href="https://github.com/meliasss" target="_blank">Laura Mongin</a></p>
    <p>Icons for Uicons by <a href="https://www.flaticon.com/uicons">Flaticon</a></p>
</footer>
</html>
